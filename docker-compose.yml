services:
  mysql:
    image: mysql:8.0
    container_name: ttagent-mysql
    restart: unless-stopped
    env_file: docker/.env
    ports:
      - "3307:3306"   # 宿主 3307 方便 Navicat 连，容器内 3306
    volumes:
      - ttagent-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d   # 首次启动自动建表
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00

  redis:
    image: redis:latest
    container_name: ttagent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: --appendonly yes
    volumes:
      - ttagent-redis-data:/data

  kafka:
    image: apache/kafka:4.1.0   # Apache 官方 KRaft 镜像，不用 ZooKeeper
    container_name: ttagent-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # 宿主 9092 方便本地 Python 连
    environment:
      # KRaft 模式配置（单节点同时当 controller 和 broker，不依赖 ZooKeeper）
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092   # 本地开发用 localhost，Docker部署时改 kafka
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ttagent-kafka-data:/var/lib/kafka/data

  admin:
    # 部署时 docker-compose pull 拉这里；本地开发可 docker-compose build
    image: docker.io/pathfinderccq/ttagent-admin:latest
    build: ./ttagent_admin
    container_name: ttagent-admin
    restart: unless-stopped
    env_file: docker/.env
    environment:
      # 容器内用容器名访问其它服务（覆盖 .env，确保容器网络正确）
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - PYTHON_CHAT_URL=http://ai-service:8000/chat
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  ai-service:
    image: docker.io/pathfinderccq/ttagent-ai:latest
    build: ./ai-service
    container_name: ttagent-ai
    restart: unless-stopped
    env_file: docker/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_HOST=kafka        # 容器内用 kafka:9092 访问
      - KAFKA_PORT=9092
    ports:
      - "8000:8000"   # 开到宿主方便调试，生产可去掉
    depends_on:
      - redis
      - kafka

  frontend:
    image: docker.io/pathfinderccq/ttagent-frontend:latest
    build: ./frontend
    container_name: ttagent-frontend
    restart: unless-stopped
    ports:
      - "80:80"   # 用户访问入口 http://localhost
    depends_on:
      - admin

volumes:
  ttagent-mysql-data:
  ttagent-redis-data:
  ttagent-kafka-data:
