server {
    listen 80;
    server_name _;

    # 前端静态文件托管
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 路由回退：所有未匹配的路径都返回 index.html（vue-router history 模式必需）
        try_files $uri $uri/ /index.html;
    }

    # 反代 /api 到 Java 后端容器（容器名 admin）
    location /api/ {
        proxy_pass http://admin:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式对话支持：关缓冲 + 拉长超时，否则 /api/chat 的流会被 nginx 缓存卡住
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
